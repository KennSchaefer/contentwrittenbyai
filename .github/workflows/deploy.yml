name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true

  deploy:
    # Only main deploys, and only once the DEPLOY_ENABLED repo variable is set to "true"
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync to SiteGround
        # --delete keeps the server in sync with the build; .well-known is preserved for SSL validation
        run: |
          rsync -az --delete --filter='P .well-known/' \
            -e "ssh -p ${{ secrets.SG_PORT }}" \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}"

  # Every push to a PR from this repo rebuilds https://preview.contentwrittenbyai.com/ with drafts included,
  # noindexed (meta tag + X-Robots-Tag header), and without analytics. The latest pushed PR wins.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_PREVIEW: 'true'
      - name: Swap in preview server config
        run: |
          cp preview/.htaccess dist/.htaccess
          cp preview/robots.txt dist/robots.txt
          rm -f dist/sitemap-*.xml
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync to the preview subdomain
        run: |
          rsync -az --delete --filter='P .well-known/' \
            -e "ssh -p ${{ secrets.SG_PORT }}" \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:www/preview.contentwrittenbyai.com/public_html/"
